# version: "3.7"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hyperleagal:latest
    container_name: hyperleagal
    restart: unless-stopped
    command:
      - /bin/sh
      - -c 
      - |
        npx prisma generate
        npm run start:dev
    ports:
      - "3001:3000"
      # - "5010:5000"
    volumes:
      - .:/usr/src/app:rw
    depends_on:
      - db
      - dynamodb
    environment:
      - NODE_ENV=development
      - DYNAMODB_ENDPOINT=http://dynamodb:8000
    networks:
      - wanzy
  # db:
  #   image: mysql:8
  #   container_name: hyperlegal-db
  #   restart: unless-stopped
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - dbdata:/var/lib/mysql
  #   environment:
  #     MYSQL_DATABASE: hyperlegal
  #     MYSQL_ROOT_PASSWORD: hyperlegal
  #     MYSQL_PASSWORD: hyperlegal
  #     MYSQL_USER: hyperlegal
  #     SERVICE_TAGS: dev
  #     SERVICE_NAME: mysql
  #   networks:
  #     - wanzy

  db:
    image: postgres:18
    container_name: postgres_db
    restart: unless-stopped 
    environment:
      POSTGRES_USER: hyperlegal 
      POSTGRES_PASSWORD: hyperlegal 
      POSTGRES_DB: hyperlegal 
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5432:5432" 
    volumes:
      - postgres_dbdata:/var/lib/postgresql/18/docker
    networks:
      - wanzy
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb_local
    restart: unless-stopped
    ports:
      - "8000:8000"
    # command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    command: "-jar DynamoDBLocal.jar -sharedDb"
    volumes:
      - dynamoDB_data:/home/dynamodblocal/data
    networks:
      - wanzy
